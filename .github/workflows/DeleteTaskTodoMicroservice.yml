name: Build and Push to ACR

on:
  workflow_dispatch:  # Isse tum manually GitHub se trigger kar sakte ho

permissions:
  id-token: write
  contents: read
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest


    env:
      IMAGE_NAME: todo-delete-tasks-api
      IMAGE_TAG: v1
      ACR_NAME: acrdevproject4480
      ACR_LOGIN_SERVER: acrdevproject4480.azurecr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: b6414b20-f23e-49d1-9440-0982e796ee54
          tenant-id: b91213f6-d0f4-4a4a-969b-448f7d38bec6
          subscription-id: bddd812c-5ad2-4c07-b152-4c3ff393fd76
          
      - name: Log in to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG -f DeleteTaskTodoMicroservice/Dockerfile DeleteTaskTodoMicroservice

      - name: Tag Docker Image for ACR
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      - name: Push Docker Image to ACR
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
